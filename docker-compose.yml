services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leilao
      POSTGRES_PASSWORD: leilao
      POSTGRES_DB: leilao
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leilao -d leilao']
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://leilao:leilao@db:5432/leilao
      # Segredos só para uso local. Em produção, defina-os no provedor.
      JWT_SECRET: ${JWT_SECRET:-segredo-local-somente-para-desenvolvimento}
      PSEUDONYM_SECRET: ${PSEUDONYM_SECRET:-pseudonimos-local-somente-para-desenvolvimento}
      NODE_ENV: production
    ports:
      - '3000:3000'

volumes:
  db-data:
